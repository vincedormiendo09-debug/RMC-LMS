<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lessons Feed - Smart Learning Platform</title>

  <!-- SUPABASE JS CLIENT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

 <style>
  /* =========================================
     GLOBAL RESET & BRAND DESIGN SYSTEM
  ========================================= */
  :root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --primary-light: #eff6ff;
    --background: #f4f7fb;
    --surface: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #16a34a;
    --success-dark: #15803d;
    --danger: #dc2626;
    --danger-dark: #b91c1c;
    --shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  html {
    scroll-behavior: smooth;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    position: relative;
  }

  /* =========================================
     SIDEBAR NAVIGATION RAIL & OVERLAY
  ========================================= */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 240px;
    height: 100vh;
    background: linear-gradient(180deg, #1e40af, #1e3a8a);
    color: #ffffff;
    padding: 22px 15px;
    z-index: 1000;
    overflow-y: auto;
    transition: transform 0.3s ease;
    box-shadow: 4px 0 15px rgba(15, 23, 42, 0.12);
  }

  .sidebar h2 {
    text-align: center;
    margin: 0 0 20px;
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
  }

  .user-profile-box {
    background: rgba(255, 255, 255, 0.15);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
  }

  .user-badge {
    display: inline-block;
    background: #fbbf24;
    color: #1e3a8a;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sidebar a,
  #sidebarMenu a {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 42px;
    margin-bottom: 8px;
    padding: 10px 14px;
    border-radius: 9px;
    color: #ffffff !important;
    text-decoration: none !important;
    font-size: 14.5px;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .sidebar a:hover,
  #sidebarMenu a:hover {
    background: rgba(255, 255, 255, 0.16) !important;
    transform: translateX(2px);
    color: #ffffff !important;
  }

  .sidebar a.active,
  #sidebarMenu a.active {
    background: rgba(255, 255, 255, 0.25) !important;
    font-weight: bold;
    color: #ffffff !important;
  }

  .sidebar-logout-btn {
    background: rgba(239, 68, 68, 0.25) !important;
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #ffffff !important;
    margin-top: 18px !important;
    cursor: pointer;
  }

  .sidebar-logout-btn:hover {
    background: rgba(239, 68, 68, 0.45) !important;
  }

  .sidebar-section {
    margin-top: 24px;
  }

  .sidebar-section-title {
    padding: 0 10px 8px;
    color: #bfdbfe;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.7px;
    text-transform: uppercase;
  }

  .sidebar-item {
    display: block;
    width: 100%;
    min-height: 38px;
    margin-bottom: 6px;
    padding: 9px 12px;
    overflow: hidden;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.10);
    color: #ffffff !important;
    text-decoration: none;
    font-size: 13px;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: background 0.2s ease;
  }

  .sidebar-item:hover {
    background: rgba(255, 255, 255, 0.20) !important;
  }

  .mobile-menu-btn {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 1100;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 10px;
    background: var(--primary-dark);
    color: #ffffff;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    align-items: center;
    justify-content: center;
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(3px);
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .sidebar-overlay.active {
    display: block;
    opacity: 1;
  }

  /* =========================================
     MAIN CONTENT AREA
  ========================================= */
  .main-content {
    margin-left: 240px;
    flex: 1 1 auto;
    min-height: 100vh;
    padding: 28px;
    width: calc(100% - 240px);
    max-width: 100%;
    min-width: 0;
    transition: margin-left 0.3s ease, width 0.3s ease, padding 0.3s ease;
  }

  .container {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    min-width: 0;
  }

  /* PAGE HEADER */
  .page-header-box {
    background: var(--surface);
    padding: 24px 28px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    min-width: 0;
  }

  .page-header-info {
    flex: 1 1 240px;
    min-width: 0;
  }

  .page-header-info h1 {
    font-size: 24px;
    color: var(--primary-dark);
    margin-bottom: 4px;
    word-break: break-word;
  }

  .page-header-info p {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.4;
  }

  .add-lesson-btn {
    background: var(--success);
    color: #ffffff;
    min-height: 42px;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s ease;
    white-space: nowrap;
  }

  .add-lesson-btn:hover {
    background: var(--success-dark);
  }

  /* =========================================
     LESSON CARDS
  ========================================= */
  .lesson-card {
    background: var(--surface);
    padding: 24px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    position: relative;
    border: 1px solid var(--border);
    border-left: 5px solid var(--primary);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    min-width: 0;
  }

  .lesson-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
  }

  .lesson-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f1f5f9;
    gap: 12px;
  }

  .lesson-card-title-group {
    flex: 1;
    min-width: 0;
  }

  .lesson-card-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    cursor: pointer;
    display: inline-block;
    transition: color 0.2s ease;
    word-break: break-word;
    line-height: 1.35;
  }

  .lesson-card-title:hover {
    color: var(--primary);
    text-decoration: underline;
  }

  .lesson-card-date {
    font-size: 12px;
    color: var(--muted);
  }

  .card-action-btns {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn-edit,
  .btn-delete {
    min-height: 36px;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: bold;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.2s ease;
    border: none;
    white-space: nowrap;
  }

  .btn-edit {
    background: var(--primary);
    color: #ffffff;
  }

  .btn-edit:hover {
    background: var(--primary-dark);
  }

  .btn-delete {
    background: var(--danger);
    color: #ffffff;
  }

  .btn-delete:hover {
    background: var(--danger-dark);
  }

  .lesson-description {
    font-size: 14.5px;
    line-height: 1.6;
    color: #475569;
    white-space: pre-line;
    margin-bottom: 14px;
    word-break: break-word;
  }

  .attachment-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    min-width: 0;
  }

  .attachment-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    color: #334155;
    font-weight: 600;
    min-width: 0;
    flex: 1 1 200px;
    word-break: break-word;
  }

  .btn-download {
    background: var(--primary-dark);
    color: #ffffff;
    text-decoration: none;
    min-height: 38px;
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.2s ease;
    white-space: nowrap;
  }

  .btn-download:hover {
    background: #172554;
  }

  .empty-state-box {
    background: var(--surface);
    padding: 40px 20px;
    text-align: center;
    border-radius: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .empty-state-icon {
    font-size: 40px;
    margin-bottom: 10px;
    color: #94a3b8;
  }

  /* BOTTOM NAVIGATION BUTTON */
  .btn-bar {
    margin-top: 15px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    background: #64748b;
    color: #ffffff;
    padding: 10px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s ease;
  }

  .back-btn:hover {
    background: #475569;
  }

  /* =========================================
     ZOOM / INSPECTION MODAL
  ========================================= */
  .lesson-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(4px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: modalFadeIn 0.2s ease-out;
  }

  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }

  .lesson-modal-content {
    background: #ffffff;
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  .lesson-modal-header {
    padding: 18px 24px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .lesson-modal-header h2 {
    font-size: 18px;
    color: var(--primary-dark);
    line-height: 1.3;
    word-break: break-word;
  }

  .modal-close-btn {
    background: transparent;
    border: none;
    font-size: 24px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    min-width: 40px;
    min-height: 40px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .modal-close-btn:hover {
    background: #e2e8f0;
    color: var(--text);
  }

  .lesson-modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
    min-width: 0;
  }

  .modal-section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .modal-description-box {
    font-size: 14.5px;
    color: #334155;
    line-height: 1.6;
    background: #f8fafc;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 20px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .modal-media-preview {
    margin-top: 15px;
    text-align: center;
    background: #0f172a;
    border-radius: 10px;
    padding: 12px;
  }

  .modal-media-preview img {
    max-width: 100%;
    max-height: 380px;
    border-radius: 6px;
    object-fit: contain;
  }

  /* =========================================
     RESPONSIVE BREAKPOINTS (RWD)
  ========================================= */
  /* Tablets and Standard Mobile Screens */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
    }

    .sidebar.active {
      transform: translateX(0);
    }

    .mobile-menu-btn {
      display: flex;
    }

    .main-content {
      margin-left: 0;
      width: 100%;
      max-width: 100vw;
      padding: 18px;
      padding-top: 74px;
    }

    .page-header-box {
      padding: 20px;
    }

    .page-header-info h1 {
      font-size: 21px;
    }

    .lesson-card {
      padding: 20px;
    }

    .lesson-modal-overlay {
      padding: 12px;
    }
  }

  /* Compact Smartphones (320px - 480px) */
  @media (max-width: 480px) {
    .main-content {
      padding: 12px;
      padding-top: 68px;
    }

    .page-header-box {
      padding: 16px 14px;
      border-radius: 12px;
    }

    .page-header-info h1 {
      font-size: 19px;
    }

    .add-lesson-btn {
      width: 100%;
      text-align: center;
    }

    .lesson-card {
      padding: 16px 14px;
      border-radius: 12px;
    }

    .lesson-card-header {
      flex-direction: column;
      gap: 10px;
    }

    .lesson-card-title {
      font-size: 17px;
    }

    .card-action-btns {
      width: 100%;
    }

    .btn-edit,
    .btn-delete {
      flex: 1;
      text-align: center;
    }

    .attachment-box {
      flex-direction: column;
      align-items: flex-start;
      padding: 12px;
    }

    .btn-download {
      width: 100%;
      text-align: center;
    }

    .lesson-modal-content {
      max-height: 92vh;
      border-radius: 12px;
    }

    .lesson-modal-header {
      padding: 14px 16px;
    }

    .lesson-modal-body {
      padding: 16px;
    }

    .back-btn {
      width: 100%;
      text-align: center;
    }
  }
</style>
</head>

<body>

  <!-- MOBILE MENU BUTTON -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar">
    <h2>Regis Marie College</h2>

    <!-- USER PROFILE & ROLE BADGE -->
    <div class="user-profile-box">
      <div id="sidebarUserName" style="font-size: 14px; font-weight: 600; color: #ffffff; margin-bottom: 4px;">User</div>
      <div class="user-badge" id="userRoleBadge">STUDENT</div>
    </div>

    <!-- DYNAMIC SIDEBAR LINKS -->
    <div id="sidebarMenu"></div>

    <!-- MY CLASSES -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">My Classes</div>
      <div id="sidebarClassList"></div>
    </div>

    <!-- MY GROUPS -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">My Groups</div>
      <div id="sidebarGroupList"></div>
    </div>

    <!-- LOGOUT BUTTON -->
    <a onclick="logoutUser()" class="sidebar-logout-btn" style="cursor: pointer; margin-top: 18px; display: block;">
      🚪 Logout
    </a>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    <div class="container">

      <!-- PAGE HEADER BOX -->
      <div class="page-header-box">
        <div class="page-header-info">
          <h1 id="classNameHeader">📘 Published Lessons Feed</h1>
          <p id="classSubtext">Explore study modules, lecture notes, and downloadable resources.</p>
        </div>
        <div id="teacherHeaderActions">
          <a href="{{ url_for('lesson_page') }}" class="add-lesson-btn">
            <i class="fa-solid fa-plus"></i> Upload New Lesson
          </a>
        </div>
      </div>

      <!-- LESSONS FEED CONTAINER -->
      <div id="lessonsFeedList">
        <div class="empty-state-box">
          <div class="empty-state-icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
          <p>Loading lesson materials from database...</p>
        </div>
      </div>

      <!-- BACK TO CLASSROOM BUTTON -->
      <a href="{{ url_for('class_page') }}" class="back-btn">← Back to Classroom</a>

    </div>
  </main>

  <!-- =====================================================
       LESSON INSPECTION / ZOOM MODAL
  ===================================================== -->
  <div id="lessonZoomModal" class="lesson-modal-overlay">
    <div class="lesson-modal-content">
      <div class="lesson-modal-header">
        <div>
          <h2 id="modalLessonTitle">Lesson Material</h2>
          <span id="modalLessonDate" style="font-size: 12px; color: #64748b; margin-top: 4px; display: block;">
            <i class="fa-regular fa-clock"></i> Date
          </span>
        </div>
        <button class="modal-close-btn" onclick="closeLessonModal()">&times;</button>
      </div>
      <div class="lesson-modal-body">
        <div class="modal-section-title">Lecture Content & Instructions</div>
        <div id="modalLessonDescription" class="modal-description-box"></div>

        <div id="modalExternalLinkArea" style="margin-bottom: 16px;"></div>
        <div id="modalAttachmentArea"></div>
      </div>
    </div>
  </div>

<script>
  /* 🔒 PREVENT BACK BUTTON BYPASS AFTER LOGOUT */
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) {
      window.location.reload();
    }
  });

  /* =====================================================
      0. TYPE-SAFE ID HELPERS
  ===================================================== */
  function parseDbId(idVal) {
    if (!idVal) return idVal;
    if (typeof idVal === 'number') return idVal;
    const str = String(idVal).trim();
    return /^\d+$/.test(str) ? parseInt(str, 10) : str;
  }

  function getDualTypeIds(idArray) {
    const result = new Set();
    (idArray || []).forEach(id => {
      if (id !== null && id !== undefined && id !== '') {
        result.add(String(id));
        const num = parseDbId(id);
        if (typeof num === 'number' && !isNaN(num)) {
          result.add(num);
        }
      }
    });
    return Array.from(result);
  }

  /* =====================================================
      1. USER SESSION & ROLE SETUP
  ===================================================== */
  const rawRole = "{{ session.get('role', '') }}" || localStorage.getItem("role") || "STUDENT";
  const userRole = rawRole.toUpperCase();
  const userName = "{{ session.get('full_name', '') }}" || localStorage.getItem("full_name") || "User";
  const currentUserId = "{{ session.get('user_id', '') }}" || localStorage.getItem("user_id");

  const badgeElem = document.getElementById("userRoleBadge");
  const nameElem = document.getElementById("sidebarUserName");
  if (badgeElem) badgeElem.textContent = userRole;
  if (nameElem) nameElem.textContent = userName;

  // 🔒 HARD BOUNDARY: Students and Admins cannot upload or author lessons
  const teacherHeaderActions = document.getElementById("teacherHeaderActions");
  if ((userRole === "STUDENT" || userRole === "ADMIN") && teacherHeaderActions) {
    teacherHeaderActions.style.display = "none";
  }

  // Flask Route URLs
  const homeUrl = "{{ url_for('landpage') }}";
  const createUrl = "{{ url_for('create_page') }}";
  const joinUrl = "{{ url_for('join_page') }}";
  const calendarUrl = "{{ url_for('calendar_page') }}";
  const myDashboardUrl = "{{ url_for('dashboard_page') }}";
  const classDashboardUrl = "{{ url_for('classdashboard_page') }}";
  const studentDashboardUrl = "{{ url_for('studentdashboard_page') }}";
  const gradesUrl = "{{ url_for('grades_page') }}";
  const studentGradesUrl = "{{ url_for('studentgrades_page') }}";
  const submissionsUrl = "{{ url_for('submissions_page') }}";
  const archiveUrl = "{{ url_for('archive_page') }}";
  const notifyUrl = "{{ url_for('notify_page') }}";
  const accountUrl = "{{ url_for('account_page') }}";
  const updateUrl = "{{ url_for('update_page') }}";
  const classPageUrl = "{{ url_for('class_page') }}";
  const groupPageUrl = "{{ url_for('group_page') }}";
  const privateMessageInboxUrl = "private-message.html";

  const sidebarMenu = document.getElementById("sidebarMenu");

  if (sidebarMenu) {
    if (userRole === "ADMIN") {
      sidebarMenu.innerHTML = `
        <a href="${homeUrl}">🏠 Institutional Hub</a>
        <a href="${classDashboardUrl}">📊 Class Inactivity Analytics</a>

  /* AUTOMATED DIRECT FILE DOWNLOAD HELPER */
  async function downloadFileDirectly(url, filename) {
    if (!url) return;
    try {
      if (url.startsWith('data:')) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || 'lecture_material';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        return;
      }
      const response = await fetch(url);
      const blob = await response.blob();
      const blobUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename || 'lecture_material';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(blobUrl);
    } catch (err) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename || 'lecture_material';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  }

  function editLesson(lessonId) {

  async function deleteLesson(lessonId, lessonTitle) {
    if (userRole !== "TEACHER") {
      alert("Only faculty instructors have permission to delete lesson materials.");
      return;
    }

    if (confirm(`Are you sure you want to delete lesson "${lessonTitle}"?`)) {
      const client = getSupabaseClient();
      if (!client) return;

      const lessonSearchIds = getDualTypeIds([lessonId]);

      const { error } = await client
        .from('lessons')
        .delete()
        .in('id', lessonSearchIds);

      if (error) {
        alert("Error deleting lesson: " + error.message);
      } else {
        alert("Lesson deleted successfully.");
        initLessonsFeed();
      }
    }
  }

  function escapeHtml(text) {
    if (!text) return "";
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* =====================================================
      6. LOAD SIDEBAR CLASSES & GROUPS (TWO-STEP QUERY)
  ===================================================== */
  async function loadSidebarClasses() {
    const client = getSupabaseClient();
    if (!client) return;

    const sidebarClassList = document.getElementById("sidebarClassList");
    if (!sidebarClassList) return;
    sidebarClassList.innerHTML = "";

    const userSearchIds = getDualTypeIds([currentUserId]);
    let myClasses = [];

    try {
      if (userRole === "TEACHER" && userSearchIds.length > 0) {
        const { data } = await client
          .from('classes')
          .select('id, subject, code, status')
          .eq('status', 'active')
          .in('teacher_id', userSearchIds)
          .order('created_at', { ascending: false });
        myClasses = data || [];
      } else if (userRole === "STUDENT" && userSearchIds.length > 0) {
        const { data: mems, error: memErr } = await client
          .from('class_memberships')
          .select('class_id')
          .in('user_id', userSearchIds);

        if (!memErr && mems && mems.length > 0) {
          const classSearchIds = getDualTypeIds(mems.map(m => m.class_id));
          if (classSearchIds.length > 0) {
            const { data: fetchedClasses } = await client
              .from('classes')
              .select('id, subject, code, status')
              .in('id', classSearchIds);
            myClasses = fetchedClasses || [];
          }
        } else {
          const joinedClasses = JSON.parse(localStorage.getItem("joinedClasses") || "[]");
          if (joinedClasses.length > 0) {
            const { data: fallbackData } = await client
              .from('classes')
              .select('id, subject, code, status')
              .in('code', joinedClasses);
            myClasses = fallbackData || [];
          }
        }
      } else {
        // ADMIN POV: Query all active institutional classes
        const { data } = await client
          .from('classes')
          .select('id, subject, code, status')
          .eq('status', 'active')
          .order('created_at', { ascending: false });
        myClasses = data || [];
      }
    } catch (err) {
      console.error("Sidebar classes error:", err);
    }

    myClasses = myClasses.filter(c => c && c.status !== 'archived');

    if (myClasses.length > 0) {
      const currentSelectedCode = localStorage.getItem("selectedClass");
      myClasses.forEach(c => {
        const sideLink = document.createElement("a");
        sideLink.className = "sidebar-item";
        if (c.code === currentSelectedCode) sideLink.style.fontWeight = "bold";
        sideLink.textContent = `📘 ${c.subject}`;
        sideLink.href = classPageUrl;
        sideLink.onclick = (e) => {
          e.preventDefault();
          localStorage.removeItem("isArchivedView");
          localStorage.setItem("selectedClass", c.code);
          localStorage.setItem("selectedClassId", String(c.id));
          window.location.href = classPageUrl;
        };
        sidebarClassList.appendChild(sideLink);
      });
    } else {
      sidebarClassList.innerHTML = `<p style="font-size:12px; opacity:0.7; padding-left:10px; color:white;">No active classes</p>`;
    }
  }
