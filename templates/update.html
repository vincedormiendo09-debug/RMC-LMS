<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PREVENT BROWSER CACHING AFTER LOGOUT -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Update Content | Regis Marie College</title>

  <!-- FONT AWESOME & GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- GOOGLE PICKER & GIS APIS -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <!-- SUPABASE JS CLIENT SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
  /* =========================================
      GLOBAL RESET & BRAND DESIGN SYSTEM
  ========================================= */
  :root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --primary-light: #dbeafe;
    --background: #f4f7fb;
    --surface: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #16a34a;
    --danger: #ef4444;
    --shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, button, input, select, textarea {
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
  }

  html {
    scroll-behavior: smooth;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    position: relative;
  }

  /* =========================================
      SIDEBAR NAVIGATION RAIL & OVERLAY
  ========================================= */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 240px;
    height: 100vh;
    background: linear-gradient(180deg, #1e40af, #1e3a8a);
    color: #ffffff;
    padding: 22px 15px;
    z-index: 1000;
    overflow-y: auto;
    transition: transform 0.3s ease;
    box-shadow: 4px 0 15px rgba(15, 23, 42, 0.12);
  }

  .sidebar h2 {
    text-align: center;
    margin: 0 0 20px;
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
  }

  .user-profile-box {
    background: rgba(255, 255, 255, 0.15);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
  }

  .user-badge {
    display: inline-block;
    background: #fbbf24;
    color: #1e3a8a;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sidebar a,
  #sidebarMenu a {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 42px;
    margin-bottom: 8px;
    padding: 10px 14px;
    border-radius: 9px;
    color: #ffffff !important;
    text-decoration: none !important;
    font-size: 14.5px;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .sidebar a:hover,
  #sidebarMenu a:hover {
    background: rgba(255, 255, 255, 0.16) !important;
    transform: translateX(2px);
    color: #ffffff !important;
  }

  .sidebar a.active,
  #sidebarMenu a.active {
    background: rgba(255, 255, 255, 0.25) !important;
    font-weight: bold;
    color: #ffffff !important;
  }

  .sidebar-logout-btn {
    background: rgba(239, 68, 68, 0.25) !important;
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #ffffff !important;
    margin-top: 18px !important;
    cursor: pointer;
  }

  .sidebar-logout-btn:hover {
    background: rgba(239, 68, 68, 0.45) !important;
  }

  .sidebar-section {
    margin-top: 24px;
  }

  .sidebar-section-title {
    padding: 0 10px 8px;
    color: #bfdbfe;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.7px;
    text-transform: uppercase;
  }

  .sidebar-item {
    display: block;
    width: 100%;
    min-height: 38px;
    margin-bottom: 6px;
    padding: 9px 12px;
    overflow: hidden;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.10);
    color: #ffffff !important;
    text-decoration: none;
    font-size: 13px;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: background 0.2s ease;
  }

  .sidebar-item:hover {
    background: rgba(255, 255, 255, 0.20) !important;
  }

  .mobile-menu-btn {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 1100;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: #ffffff;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    align-items: center;
    justify-content: center;
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(3px);
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .sidebar-overlay.active {
    display: block;
    opacity: 1;
  }

  /* =========================================
      MAIN FORM CONTAINER
  ========================================= */
  .main-content {
    margin-left: 240px;
    min-height: 100vh;
    padding: 28px;
    flex: 1 1 auto;
    width: calc(100% - 240px);
    max-width: 100%;
    min-width: 0;
    transition: margin-left 0.3s ease, width 0.3s ease, padding 0.3s ease;
  }

  .container {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    background: var(--surface);
    padding: 30px;
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    min-width: 0;
  }

  /* ACTIVITY HEADER & DROPDOWN */
  .activity-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }

  .activity-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .activity-header h2 {
    font-size: 21px;
    color: var(--primary-dark);
    font-weight: 700;
    margin: 0;
    word-break: break-word;
    line-height: 1.3;
  }

  .type-badge {
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .menu-container {
    position: relative;
  }

  .three-dots-btn {
    background: transparent;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--muted);
    min-width: 38px;
    min-height: 38px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .three-dots-btn:hover {
    background: #f1f5f9;
    color: var(--text);
  }

  .dropdown-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 42px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    z-index: 100;
    min-width: 160px;
    overflow: hidden;
  }

  .dropdown-menu.show {
    display: block;
  }

  .dropdown-item {
    width: 100%;
    min-height: 40px;
    padding: 10px 14px;
    border: none;
    background: #ffffff;
    text-align: left;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s ease;
    white-space: nowrap;
  }

  .dropdown-item:hover {
    background: #f8fafc;
  }

  .dropdown-item.clear {
    color: var(--danger);
  }

  /* FORM STYLES */
  label {
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: #334155;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .required {
    color: var(--danger);
  }

  input[type="text"],
  input[type="date"],
  input[type="time"],
  input[type="number"],
  input[type="url"],
  select,
  textarea {
    width: 100%;
    min-height: 44px;
    padding: 10px 14px;
    margin-top: 6px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #f8fafc;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }

  textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.55;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.4;
  }

  .picker-btn {
    background: #f1f5f9;
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 44px;
    padding: 0 14px;
    cursor: pointer;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
  }

  .picker-btn:hover {
    background: #e2e8f0;
  }

  /* =========================================================
      GOOGLE CLASSROOM "+ ADD OR CREATE" ATTACHMENT HUB STYLES
  ========================================================= */
  .attach-section {
    margin-top: 16px;
    margin-bottom: 12px;
  }

  .attach-dropdown-wrapper {
    position: relative;
    display: inline-block;
    margin-top: 6px;
    margin-bottom: 12px;
  }

  .btn-add-create {
    background: #ffffff;
    color: var(--primary);
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-add-create:hover {
    background: #f8fafc;
    border-color: var(--primary);
  }

  .attach-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    min-width: 220px;
    z-index: 50;
    padding: 6px 0;
  }

  .attach-menu.active {
    display: block;
  }

  .attach-menu-item {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    padding: 10px 18px;
    font-size: 13.5px;
    color: #334155;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .attach-menu-item:hover {
    background: #f1f5f9;
  }

  .attach-menu-item i {
    font-size: 16px;
    width: 18px;
    text-align: center;
  }

  .item-drive i { color: #0f9d58; }
  .item-link i { color: var(--primary); }
  .item-file i { color: #64748b; }
  .item-docs i { color: #4285f4; }
  .item-slides i { color: #f4b400; }
  .item-sheets i { color: #0f9d58; }

  .attach-menu-divider {
    height: 1px;
    background: var(--border);
    margin: 6px 0;
  }

  .attach-menu-label {
    padding: 4px 18px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  /* PREVIEW ATTACHMENT CARDS */
  .attachments-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }

  .attachment-card {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .attachment-card:hover {
    background: #ffffff;
    border-color: #cbd5e1;
  }

  .attachment-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .attachment-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  .attachment-details {
    min-width: 0;
    flex: 1;
  }

  .attachment-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .attachment-meta {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }

  .attachment-meta a {
    color: var(--primary);
    text-decoration: underline;
  }

  .btn-remove-attachment {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 6px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .btn-remove-attachment:hover {
    color: var(--danger);
    background: #fee2e2;
  }

  /* ATTACH LINK / DRIVE MODAL */
  .attach-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(2px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .attach-modal-overlay.active {
    display: flex;
  }

  .attach-modal-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 30px rgba(0, 0, 0, 0.15);
  }

  .attach-modal-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .attach-modal-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .attach-modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
  }

  .btn-modal-cancel {
    background: #f1f5f9;
    color: #475569;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-modal-submit {
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-modal-submit:hover {
    background: var(--primary-dark);
  }

  /* ACTION BUTTONS */
  .buttons {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .buttons button,
  .buttons a {
    min-height: 44px;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.2s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  .buttons .cancel {
    background: #64748b;
    color: #ffffff;
    border: none;
  }

  .buttons .cancel:hover {
    background: #475569;
  }

  .buttons .save {
    background: var(--primary);
    color: #ffffff;
    border: none;
  }

  .buttons .save:hover {
    background: var(--primary-dark);
  }

  /* =========================================
      RESPONSIVE BREAKPOINTS (RWD)
  ========================================= */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
    }

    .sidebar.active {
      transform: translateX(0);
    }

    .mobile-menu-btn {
      display: flex;
    }

    .main-content {
      margin-left: 0;
      width: 100%;
      max-width: 100vw;
      padding: 18px;
      padding-top: 74px;
    }

    .container {
      padding: 24px 20px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    input[type="number"],
    input[type="url"],
    select,
    textarea {
      font-size: 16px;
    }
  }

  @media (max-width: 480px) {
    .main-content {
      padding: 12px;
      padding-top: 68px;
    }

    .container {
      padding: 20px 16px;
      border-radius: 12px;
    }

    .activity-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .activity-header h2 {
      font-size: 18px;
    }

    .buttons {
      flex-direction: column-reverse;
      gap: 10px;
      width: 100%;
    }

    .buttons button,
    .buttons a {
      width: 100%;
      text-align: center;
      justify-content: center;
    }
  }
</style>
</head>

<body>

  <!-- MOBILE MENU BUTTON -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar">
    <h2>Regis Marie College</h2>

    <!-- USER PROFILE & ROLE BADGE -->
    <div class="user-profile-box">
      <div id="sidebarUserName" style="font-size: 14px; font-weight: 600; color: #ffffff; margin-bottom: 4px;">User</div>
      <div class="user-badge" id="userRoleBadge">TEACHER</div>
    </div>

    <!-- DYNAMIC SIDEBAR LINKS -->
    <div id="sidebarMenu"></div>

    <!-- MY CLASSES -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">My Classes</div>
      <div id="sidebarClassList"></div>
    </div>

    <!-- MY GROUPS -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">My Groups</div>
      <div id="sidebarGroupList"></div>
    </div>

    <!-- LOGOUT BUTTON -->
    <a onclick="logoutUser()" class="sidebar-logout-btn" style="cursor: pointer; margin-top: 18px; display: block;">
      🚪 Logout
    </a>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    <div class="container">
      <div class="activity-header">
        <h2 id="pageTitle">✏️ Update Content</h2>
        <span class="type-badge" id="modeBadge">Lesson / Activity</span>

        <!-- 3-DOTS MENU -->
        <div class="menu-container">
          <button class="three-dots-btn" id="threeDotsBtn" onclick="toggleDropdown(event)">⋮</button>
          <div class="dropdown-menu" id="dropdownMenu">
            <button class="dropdown-item clear" onclick="resetForm()"><i class="fa-solid fa-rotate-left"></i> Reset Fields</button>
            <a href="{{ url_for('class_page') }}" class="dropdown-item" style="text-decoration:none;"><i class="fa-solid fa-xmark"></i> Cancel</a>
          </div>
        </div>
      </div>

      <form id="updateForm">
        <!-- TITLE FIELD -->
        <label for="title">Title <span class="required">*</span></label>
        <input type="text" id="title" required placeholder="Enter title">

        <!-- DESCRIPTION FIELD -->
        <label for="description">Description / Content Overview:</label>
        <textarea id="description" rows="5" placeholder="Explain details or instructions"></textarea>

        <!-- =========================================================
             GOOGLE CLASSROOM STYLE "+ ADD OR CREATE" ATTACHMENT HUB
        ========================================================= -->
        <div class="attach-section">
          <label><i class="fa-solid fa-paperclip"></i> Reference Materials & Attachments:</label>

          <div class="attach-dropdown-wrapper">
            <button type="button" class="btn-add-create" id="addCreateBtn" onclick="toggleAttachMenu(event)">
              <i class="fa-solid fa-plus"></i> Add or create
              <i class="fa-solid fa-caret-down" style="font-size: 11px; margin-left: 2px;"></i>
            </button>

            <!-- DROPDOWN MENU -->
            <div class="attach-menu" id="attachMenu">
              <button type="button" class="attach-menu-item item-drive" onclick="openGoogleDrivePicker()">
                <i class="fa-brands fa-google-drive"></i> Google Drive
              </button>
              <button type="button" class="attach-menu-item item-link" onclick="openLinkModal('link')">
                <i class="fa-solid fa-link"></i> Link
              </button>
              <button type="button" class="attach-menu-item item-file" onclick="triggerFileUpload()">
                <i class="fa-solid fa-paperclip"></i> File
              </button>

              <div class="attach-menu-divider"></div>
              <div class="attach-menu-label">Create new</div>

              <button type="button" class="attach-menu-item item-docs" onclick="createNewGoogleDoc('docs')">
                <i class="fa-solid fa-file-word"></i> Docs
              </button>
              <button type="button" class="attach-menu-item item-slides" onclick="createNewGoogleDoc('slides')">
                <i class="fa-solid fa-file-powerpoint"></i> Slides
              </button>
              <button type="button" class="attach-menu-item item-sheets" onclick="createNewGoogleDoc('sheets')">

  ===================================================== */
  function parseDbId(idVal) {
    if (!idVal) return idVal;
    if (typeof idVal === 'number') return idVal;
    const str = String(idVal).trim();
    if (/^\d+$/.test(str)) {
      return parseInt(str, 10);
    }
    return str;
  }

  function getDualTypeIds(idArray) {
    const result = new Set();
    (idArray || []).forEach(id => {
      if (id !== null && id !== undefined && id !== '') {
        result.add(String(id));
        const num = parseDbId(id);
        if (typeof num === 'number' && !isNaN(num)) {
          result.add(num);
        }
      }
    });
    return Array.from(result);
  }

  function escapeHtml(text) {
    if (!text) return "";
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatUrl(url) {
    if (!url) return null;
    let trimmed = url.trim();
    if (!trimmed) return null;
    if (!/^https?:\/\//i.test(trimmed)) {
      return 'https://' + trimmed;
    }
    return trimmed;
  }

  function formatAttachmentSize(bytes) {
    if (!bytes || isNaN(bytes) || bytes <= 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return `${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${sizes[i]}`;
  }

  // Safe deserializer handling both JSON arrays and single URL strings
  function parseMaterials(raw, defaultType = 'file') {
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    } catch (e) {
      // Plain string fallback
    }
    return [{
      name: defaultType === 'file' ? 'Attached Reference File' : raw,
      url: raw,
      type: defaultType
    }];
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });

  function createPicker(token) {
    if (!pickerInited || !token) return;

    const viewRecent = new google.picker.DocsView(google.picker.ViewId.RECENTLY_PICKED);
    const viewDocs = new google.picker.DocsView(google.picker.ViewId.DOCS);
    const viewDrive = new google.picker.DocsView(google.picker.ViewId.DOCS).setIncludeFolders(true);

    const pickerBuilder = new google.picker.PickerBuilder()
      .enableFeature(google.picker.Feature.NAV_HIDDEN, false)
      .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
      .setAppId(GOOGLE_APP_ID)
      .setOAuthToken(token)
      .addView(viewRecent)
      .addView(viewDocs)
      .addView(viewDrive)
      .setDeveloperKey(GOOGLE_API_KEY)
      .setTitle("Insert files using Google Drive")
      .setCallback(pickerCallback);

    const picker = pickerBuilder.build();
    picker.setVisible(true);
  }

  function pickerCallback(data) {
    if (data[google.picker.Response.ACTION] === google.picker.Action.PICKED) {
      const documents = data[google.picker.Response.DOCUMENTS];
      if (!documents || documents.length === 0) return;

      documents.forEach((doc) => {
        const fileUrl = doc[google.picker.Document.URL];
        const fileName = doc[google.picker.Document.NAME];
        const mimeType = doc[google.picker.Document.MIME_TYPE] || "";

        let itemType = 'drive';
        if (mimeType.includes("document")) itemType = 'docs';
        else if (mimeType.includes("presentation")) itemType = 'slides';
        else if (mimeType.includes("spreadsheet")) itemType = 'sheets';

        if (!attachedItems.some(item => item.url === fileUrl)) {
          attachedItems.push({
            type: itemType,
            url: fileUrl,
            name: fileName
          });
        }
      });

      renderAttachments();
    }
  }

  async function initUpdateForm() {
    const client = getSupabaseClient();
    if (!client) return;

    const pageTitle = document.getElementById("pageTitle");
    const modeBadge = document.getElementById("modeBadge");
    const activityFields = document.getElementById("activityFields");

    const rawType = localStorage.getItem("updateType");
    const selectedActivityId = localStorage.getItem("selectedActivityId");
    const selectedLessonId = localStorage.getItem("selectedLessonId");

    if (rawType === "activity" && selectedActivityId) {
      updateType = "activity";
      activeRecordId = selectedActivityId;
    } else if (rawType === "lesson" && selectedLessonId) {
      updateType = "lesson";
      activeRecordId = selectedLessonId;
    } else if (selectedActivityId) {
      updateType = "activity";
      activeRecordId = selectedActivityId;
    } else if (selectedLessonId) {
      updateType = "lesson";
      activeRecordId = selectedLessonId;
    } else {
      alert("No lesson or activity selected for editing. Returning to classroom workspace.");
      window.location.href = classPageUrl;
      return;
    }

    const searchIds = getDualTypeIds([activeRecordId]);
    attachedItems = [];

    if (updateType === "activity") {
      if (pageTitle) pageTitle.innerHTML = '✏️ Update Activity';
      if (modeBadge) modeBadge.textContent = 'Activity Mode';
      if (activityFields) activityFields.style.display = "block";

      const { data: activity, error } = await client
        .from('activities')
        .select('*')
        .in('id', searchIds)
        .maybeSingle();

      if (activity && !error) {
        currentRecord = activity;
        document.getElementById('title').value = activity.title || "";
        document.getElementById('description').value = activity.description || "";
        document.getElementById('score').value = (activity.total_points !== null && activity.total_points !== undefined) ? activity.total_points : 100;

        // Unpack multi-item file materials with intelligent filename decoding
        if (activity.file_url) {
          const files = parseMaterials(activity.file_url, 'file');
          files.forEach(f => {
            if (!f.url) return;
            const ext = f.ext || f.url.split('.').pop().split('?')[0].toLowerCase();
            let fileName = f.name || "";
            if (!fileName || fileName === 'Attached Reference File' || fileName.startsWith('http')) {
              try {
                const parts = f.url.split('/');
                fileName = decodeURIComponent(parts[parts.length - 1].split('?')[0]);
              } catch (e) {
                fileName = `Reference_File.${ext}`;
              }
            }

            attachedItems.push({
              type: 'file',
              url: f.url,
              name: fileName,
              size: f.size || 0,
              ext: ext
            });
          });
        }

        // Unpack multi-item link and Drive resources
        if (activity.link_url) {
          const links = parseMaterials(activity.link_url, 'link');
          links.forEach(l => {
            if (!l.url) return;
            let itemType = l.type || 'link';
            if (l.url.includes("drive.google.com")) itemType = 'drive';
            else if (l.url.includes("docs.google.com/document")) itemType = 'docs';
            else if (l.url.includes("docs.google.com/presentation")) itemType = 'slides';
            else if (l.url.includes("docs.google.com/spreadsheets")) itemType = 'sheets';

            attachedItems.push({
              type: itemType,
              url: l.url,
              name: l.name || l.url
            });
          });
        }

        renderAttachments();

        const deadlineVal = activity.deadline || activity.due_date;
        if (deadlineVal) {
          const dt = new Date(deadlineVal);
          if (!isNaN(dt.getTime())) {
            const year = dt.getFullYear();
            const month = String(dt.getMonth() + 1).padStart(2, '0');
            const day = String(dt.getDate()).padStart(2, '0');
            const hours = String(dt.getHours()).padStart(2, '0');
            const minutes = String(dt.getMinutes()).padStart(2, '0');
            document.getElementById('date').value = `${year}-${month}-${day}`;
            document.getElementById('time').value = `${hours}:${minutes}`;
          }
        }
      } else {
        alert("Could not load activity details from database.");
      }

    } else if (updateType === "lesson") {
      if (pageTitle) pageTitle.innerHTML = '✏️ Update Lesson';
      if (modeBadge) modeBadge.textContent = 'Lesson Mode';
      if (activityFields) activityFields.style.display = "none";

      const { data: lesson, error } = await client
        .from('lessons')
        .select('*')
        .in('id', searchIds)
        .maybeSingle();

      if (lesson && !error) {
        currentRecord = lesson;
        document.getElementById('title').value = lesson.title || "";
        document.getElementById('description').value = lesson.content || lesson.description || "";

        if (lesson.file_url) {
          const files = parseMaterials(lesson.file_url, 'file');
          files.forEach(f => {
            if (!f.url) return;
            const ext = f.ext || f.url.split('.').pop().split('?')[0].toLowerCase();
            let fileName = f.name || "";
            if (!fileName || fileName === 'Attached Reference File' || fileName.startsWith('http')) {
              try {
                const parts = f.url.split('/');
                fileName = decodeURIComponent(parts[parts.length - 1].split('?')[0]);
              } catch (e) {
                fileName = `Lesson_File.${ext}`;
              }
            }

            attachedItems.push({
              type: 'file',
              url: f.url,
              name: fileName,
              size: f.size || 0,
              ext: ext
            });
          });
        }

        if (lesson.link_url) {
          const links = parseMaterials(lesson.link_url, 'link');
          links.forEach(l => {
            if (!l.url) return;
            let itemType = l.type || 'link';
            if (l.url.includes("drive.google.com")) itemType = 'drive';
            else if (l.url.includes("docs.google.com/document")) itemType = 'docs';
            else if (l.url.includes("docs.google.com/presentation")) itemType = 'slides';
            else if (l.url.includes("docs.google.com/spreadsheets")) itemType = 'sheets';

            attachedItems.push({
              type: itemType,
              url: l.url,
              name: l.name || l.url
            });
          });
        }

        renderAttachments();
      } else {
        alert("Could not load lesson details from database.");
      }
    }
  }

  window.resetForm = function () {
    if (confirm("Reset fields back to original database values?")) {
      initUpdateForm();
    }
  };

  /* =====================================================
      5. SUBMIT UPDATED DATA WITH AI SAFETY & MULTI-UPLOAD
  ===================================================== */
  const updateForm = document.getElementById('updateForm');
  const submitBtn = document.getElementById('submitBtn');

  if (updateForm) {
    updateForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const client = getSupabaseClient();
      if (!client || !activeRecordId) {
        alert("Database error or record ID missing.");
        return;
      }

      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();

      // Content Moderation
      try {
        const aiResponse = await fetch('/api/ai-moderate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `${title} ${description}` })
        });
        if (aiResponse.ok) {
          const aiData = await aiResponse.json();
          if (!aiData.allowed) {
            alert(`🛑 Blocked by AI Safety Filter: ${aiData.reason || 'Prohibited language detected.'}`);
            return;
          }
        }
      } catch (err) {
        console.warn("AI moderation check bypassed due to network issue:", err);
      }

      // Group all queued files and links
      const fileAttachments = attachedItems.filter(i => i.type === 'file');
      const linkAttachments = attachedItems.filter(i => i.type !== 'file' && i.url);

      // Date validation for activities
      let deadlineIso = null;
      let dateVal = "";
      let timeVal = "23:59";
      let scoreVal = 100;

      if (updateType === "activity") {
        dateVal = document.getElementById('date').value;
        timeVal = document.getElementById('time').value || "23:59";
        scoreVal = parseInt(document.getElementById('score').value, 10) || 100;

        if (!dateVal) {
          alert("Due Date is a required field for activities.");
          return;
        }
        deadlineIso = new Date(`${dateVal}T${timeVal}:00`).toISOString();
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving Changes & Notifying Students...';

      // Upload newly added files to Supabase Storage Bucket ('lesson-files')
      const uploadedFiles = [];
      const classId = currentRecord?.class_id || localStorage.getItem("selectedClassId") || "general";

      for (const item of fileAttachments) {
        if (item.file) {
          const pickedFile = item.file;
          const ext = item.ext || pickedFile.name.split('.').pop().toLowerCase();

          try {
            const fileName = `update_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;
            const filePath = `${classId}/${fileName}`;

            const { data: uploadData, error: uploadError } = await client.storage
              .from('lesson-files')
              .upload(filePath, pickedFile);

            if (!uploadError && uploadData) {
              const { data: urlData } = client.storage.from('lesson-files').getPublicUrl(filePath);
              uploadedFiles.push({
                name: item.name,
                url: urlData.publicUrl,
                ext: ext,
                size: item.size
              });
            } else {
              const base64Url = await readFileAsDataURL(pickedFile);
              uploadedFiles.push({
                name: item.name,
                url: base64Url,
                ext: ext,
                size: item.size
              });
            }
          } catch (err) {
            const base64Url = await readFileAsDataURL(pickedFile);
            uploadedFiles.push({
              name: item.name,
              url: base64Url,
              ext: ext,
              size: item.size
            });
          }
        } else if (item.url) {
          // Keep existing file URL
          uploadedFiles.push({
            name: item.name,
            url: item.url,
            ext: item.ext || item.url.split('.').pop().split('?')[0].toLowerCase(),
            size: item.size || 0
          });
        }
      }

      // Format Links and Drive Resources
      const linkItems = linkAttachments.map(i => ({
        name: i.name || i.url,
        url: formatUrl(i.url),
        type: i.type
      }));

      // Serialize arrays: JSON string if multiple, plain string if 1, null if empty
      const finalFileUrl = uploadedFiles.length > 1
        ? JSON.stringify(uploadedFiles)
        : (uploadedFiles[0]?.url || null);

      const finalLinkUrl = linkItems.length > 1
        ? JSON.stringify(linkItems)
        : (linkItems[0]?.url || null);

      const searchIds = getDualTypeIds([activeRecordId]);

      if (updateType === "activity") {
        const updatePayload = {
          title: title,
          description: description,
          deadline: deadlineIso,
          due_date: deadlineIso,
          total_points: scoreVal,
          link_url: finalLinkUrl,
          file_url: finalFileUrl,
          notification_log: {}
        };

        // Retain policies if present on record
        if (currentRecord?.allow_late !== undefined) updatePayload.allow_late = currentRecord.allow_late;
        if (currentRecord?.mark_late !== undefined) updatePayload.mark_late = currentRecord.mark_late;

        const { error } = await client
          .from('activities')
          .update(updatePayload)
          .in('id', searchIds);

        if (error) {
          alert("Error updating activity: " + error.message);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Changes';
          return;
        }

        await dispatchUpdateNotifications({
          client: client,
          classId: classId,
          title: title,
          notifType: 'updated_activity',
          detailsText: `Updated Deadline: ${dateVal} at ${timeVal} | Points: ${scoreVal}`,
          activityId: activeRecordId
        });

        alert("🎉 Activity updated successfully! Reminders have recalibrated and students have been alerted.");
        window.location.href = classPageUrl;

      } else if (updateType === "lesson") {
        const { error } = await client
          .from('lessons')
          .update({
            title: title,
            content: description,
            link_url: finalLinkUrl,
            file_url: finalFileUrl
          })
          .in('id', searchIds);

        if (error) {
          alert("Error updating lesson: " + error.message);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Changes';
          return;
        }

        await dispatchUpdateNotifications({
          client: client,
          classId: classId,
          title: title,
          notifType: 'updated_lesson',
          detailsText: "Lesson materials have been modified. Please review the updated content in your portal.",
          activityId: null
        });

        alert("🎉 Lesson updated successfully! Students have been notified.");
        window.location.href = lessonsPageUrl;
      }
    });
  }

  /* =====================================================
      6. NOTIFICATION DISPATCH HELPER (PUSH + EMAIL + IN-APP)
  ===================================================== */
  async function dispatchUpdateNotifications({ client, classId, title, notifType, detailsText, activityId }) {
    if (!classId) return;

    try {
      let className = "Regis Marie College Class";
      const { data: clsData } = await client
        .from('classes')
        .select('subject')
        .in('id', getDualTypeIds([classId]))
        .maybeSingle();
      if (clsData?.subject) className = clsData.subject;

      const { data: enrolledMembers } = await client
        .from('class_memberships')
        .select('user_id')
        .in('class_id', getDualTypeIds([classId]));

      if (!enrolledMembers || enrolledMembers.length === 0) return;

      const studentUserIds = getDualTypeIds(enrolledMembers.map(m => m.user_id));
      const notifHeader = notifType === 'updated_activity' ? `✏️ Activity Updated: ${title}` : `📖 Lesson Updated: ${title}`;

      const inAppRecords = enrolledMembers.map(m => ({
        user_id: parseDbId(m.user_id),
        title: notifHeader,
        message: `${title} in ${className} was modified. ${detailsText}`,
        is_read: false,
        activity_id: activityId ? parseDbId(activityId) : null,
        created_at: new Date().toISOString()
      }));

      await client.from('notifications').insert(inAppRecords);

      const { data: studentUsers } = await client
        .from('users')
        .select('id, email')
        .in('id', studentUserIds);

      const studentEmails = (studentUsers || []).map(u => u.email).filter(Boolean);
      const studentIdStrings = (studentUsers || []).map(u => String(u.id));

      if (studentEmails.length > 0 || studentIdStrings.length > 0) {
        await fetch('/api/notify-users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            class_title: className,
            title: title,
            type: notifType,
            student_emails: studentEmails,
            student_ids: studentIdStrings,
            details: detailsText
          })
        });
      }
    } catch (err) {
      console.warn("Update notification dispatch error:", err);
    }
  }

  /* =====================================================
      7. LOAD SIDEBAR CLASSES & GROUPS
  ===================================================== */
  async function loadSidebarClasses() {
    const client = getSupabaseClient();
    if (!client) return;

    const sidebarClassList = document.getElementById("sidebarClassList");
    if (!sidebarClassList) return;
    sidebarClassList.innerHTML = "";

    const userSearchIds = getDualTypeIds([currentUserId]);
    let myClasses = [];

    try {
      if (userRole === "TEACHER" && userSearchIds.length > 0) {
        const { data } = await client
          .from('classes')
          .select('id, subject, code, status')
          .eq('status', 'active')
          .in('teacher_id', userSearchIds)
          .order('created_at', { ascending: false });
        myClasses = data || [];
      } else {
        const { data } = await client
          .from('classes')
          .select('id, subject, code, status')
          .eq('status', 'active')
          .order('created_at', { ascending: false });
        myClasses = data || [];
      }
    } catch (err) {
      console.error("Sidebar classes error:", err);
    }

    myClasses = myClasses.filter(c => c && c.status !== 'archived');

    if (myClasses.length > 0) {
      myClasses.forEach(c => {
        const sideLink = document.createElement("a");
        sideLink.className = "sidebar-item";
        sideLink.textContent = `📘 ${c.subject}`;
        sideLink.href = classPageUrl;
        sideLink.onclick = (e) => {
          e.preventDefault();
          localStorage.setItem("selectedClass", c.code);
          localStorage.setItem("selectedClassId", String(c.id));
          window.location.href = classPageUrl;
        };
        sidebarClassList.appendChild(sideLink);
      });
    } else {
      sidebarClassList.innerHTML = `<p style="font-size:12px; opacity:0.7; padding-left:10px; color:white;">No active classes</p>`;
    }
  }

    const client = getSupabaseClient();
    if (!client) return;

    const sidebarGroupList = document.getElementById("sidebarGroupList");
    if (!sidebarGroupList) return;
    sidebarGroupList.innerHTML = "";

      if (userRole === "TEACHER" && userSearchIds.length > 0) {

          .eq('status', 'active')
          .in('teacher_id', userSearchIds)
          .order('created_at', { ascending: false });
        myGroups = data || [];
      } else {
        const { data } = await client
          .from('groups')
          .select('id, name, code, status')
          .eq('status', 'active')
          .order('created_at', { ascending: false });
        myGroups = data || [];
      }
    } catch (err) {

    }

    if (myGroups.length > 0) {
      myGroups.forEach(g => {

        sideLink.textContent = `👥 ${g.name}`;
        sideLink.href = groupPageUrl;
        sideLink.onclick = (e) => {
          e.preventDefault();
          localStorage.setItem("selectedGroup", g.code);
          localStorage.setItem("selectedGroupId", String(g.id));
          window.location.href = groupPageUrl;
        };
        sidebarGroupList.appendChild(sideLink);
      });

      sidebarGroupList.innerHTML = `<p style="font-size:12px; opacity:0.7; padding-left:10px; color:white;">No active groups</p>`;
    }
  }
